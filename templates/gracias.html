{% extends "base.html" %}
{% block contenido %}
<h1>¡Formulario completado!</h1>
<p>Gracias, <strong>{{ r.nombre }}</strong>. Tu información fue registrada (registro n.º {{ r.id }}).</p>
<p>
    <a class="boton" href="{{ url_for('registro_pdf', rid=r.id) }}">Descargar PDF</a>
    <a class="boton secundario" href="{{ url_for('registro_detalle', rid=r.id) }}">Ver registro</a>
</p>
<p class="nota">Recuerda entregar también los documentos solicitados en la sección 11.</p>
{% endblock %}
