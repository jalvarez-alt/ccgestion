{% extends "base.html" %}
{% block titulo %}Iniciar sesión - C&amp;C Gestión{% endblock %}
{% block clase %}entrada{% endblock %}
{% block contenido %}
<div class="tarjeta-centro">
    <h1>Iniciar sesión</h1>
    {% if error %}<div class="errores">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label class="campo">Correo electrónico
            <input type="email" name="correo" required autofocus maxlength="190">
        </label>
        <label class="campo">Contraseña
            <input type="password" name="clave" required maxlength="200">
        </label>
        <button type="submit" class="grande">Entrar</button>
    </form>
    <p class="nota"><a href="{{ url_for('inicio') }}">&larr; Volver al inicio</a></p>
</div>
{% endblock %}
